[project]
name = "hand-retarget"
version = "0.1.0"
description = "Retarget a human hand skeleton from video onto a UR5e + Tesollo DG5F and replay it"
readme = "README.md"
authors = [
    { name = "Simone Cirelli", email = "simone.cirelli01@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pyzmq",
    "dex-retargeting",
    "pin",
    "viser",
    "yourdfpy",
    "torch",
    "httpx",
    "pillow",
    "imageio-ffmpeg",
    "fastapi",
    "uvicorn",
    "mujoco==3.14.0",
]

[project.scripts]
hand-retarget-view = "hand_retarget.viewer:main"
hand-retarget-export = "hand_retarget.cli:export_main"
h3-retarget = "hand_retarget.inference:main"
h3-retarget-web = "hand_retarget.webapp:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "fastapi",
    "pyzmq",
]

# dex-retargeting needs torch, and CPU-only torch is enough for it.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
